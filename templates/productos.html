{% extends "base.html" %}
{% block title %}Productos{% endblock %}
{% block content %}
<h1>Productos</h1>

<form method="get" action="/productos">
    <input type="text" name="q" value="{{ q }}" placeholder="Buscar por nombre...">
    <button type="submit">Buscar</button>
</form>

<table border="1">
    <tr><th>Nombre</th><th>Tipo</th><th>Costo</th><th>Precio</th><th>Stock</th></tr>
    {% for p in productos %}
    <tr>
        <td>{{ p["name"] }}</td>
        <td>{{ p["type"] }}</td>
        <td>{{ p["cost"] }}</td>
        <td>{{ p["price"] }}</td>
        <td>{{ p["stock"] }}</td>
    </tr>
    {% else %}
    <tr><td colspan="5">No hay productos</td></tr>
    {% endfor %}
</table>
{% endblock %}
